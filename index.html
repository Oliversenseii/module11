<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI Widget Examples</title>
<style>
  :root{--bg:#f6f5f2;--ink:#14161a;--line:#cfcbc2;--accent:#1d3557}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;
    padding:clamp(1rem,4vw,3rem);
    background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .grid{
    width:min(100%,70rem);
    display:grid;gap:clamp(1rem,2.5vw,2rem);
    grid-template-columns:repeat(auto-fit,minmax(min(100%,20rem),1fr));
  }
  .box{
    display:flex;align-items:center;justify-content:center;text-align:center;
    min-height:clamp(10rem,22vw,16rem);
    padding:clamp(1.25rem,3vw,2.5rem);
    background:#fff;color:var(--ink);text-decoration:none;
    border:0.125rem solid var(--ink);border-radius:0.5rem;
    font-size:clamp(1.75rem,1.3rem + 2vw,3rem);font-weight:700;letter-spacing:-0.01em;
    transition:background .2s,color .2s,transform .2s;
  }
  .box:hover,.box:focus-visible{background:var(--accent);color:#fff;border-color:var(--accent);transform:translateY(-0.25rem);outline:none}
</style>
</head>
<body>

<main class="grid">
  <a class="box" href="carousel.html">Carousel</a>
  <a class="box" href="collapsible.html">Collapsible Text</a>
  <a class="box" href="form.html">Form</a>
  <a class="box" href="map.html">Map</a>
</main>

</body>
</html>
